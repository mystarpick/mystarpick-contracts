[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

# GIWA Sepolia testnet, chain id 91342
[rpc_endpoints]
giwa_sepolia = "https://sepolia-rpc.giwa.io"

# Blockscout verification for GIWA Sepolia.
# Blockscout does not require a real API key; the placeholder keeps forge's config happy.
[etherscan]
giwa_sepolia = {key = "${GIWA_SCAN_API_KEY}", chain = 91342, url = "https://sepolia-explorer.giwa.io/api"}
